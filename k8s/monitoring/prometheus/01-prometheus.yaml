global:
  scrape_interval: 5s

scrape_configs:
  - job_name: 'kong'
    static_configs:
      - targets: ['kong-service:8001']

  - job_name: 'apis'
    static_configs:
      - targets:
          - 'catalog-service:80'
          - 'users-service:80'
          - 'payments-service:80'
          - 'orchestrator-service:80'
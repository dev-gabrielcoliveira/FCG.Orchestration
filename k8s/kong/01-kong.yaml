_format_version: "3.0"
_transform: true

services:

  - name: auth-service
    url: http://users-api:8080
    routes:
      - name: auth-route
        paths:
          - /auth
        strip_path: false

  - name: catalog-service
    url: http://catalog-api-container:8080
    routes:
      - name: catalog-route
        paths:
          - /catalog
        strip_path: true

  - name: users-service
    url: http://users-api:8080
    routes:
      - name: users-route
        paths:
          - /api/usuario
        strip_path: false

  - name: payments-service
    url: http://payments-api-container:8080
    routes:
      - name: payments-route
        paths:
          - /payments
        strip_path: false

  - name: orchestrator-service
    url: http://orchestrator-api-container:8080
    routes:
      - name: orchestrator-route
        paths:
          - /orchestrator
        strip_path: false
        plugins:
          - name: jwt
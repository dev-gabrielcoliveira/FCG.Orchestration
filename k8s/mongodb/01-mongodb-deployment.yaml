apiVersion: apps/v1
kind: Deployment
metadata:
  name: mongodb-catalog
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mongodb-catalog
  template:
    metadata:
      labels:
        app: mongodb-catalog
    spec:
      containers:
      - name: mongo
        image: mongo:latest
        ports:
        - containerPort: 27017
        resources:
          limits:
            cpu: "500m"
            memory: "512Mi"
          requests:
            cpu: "250m"
            memory: "256Mi"
        volumeMounts:
        - name: mongo-data
          mountPath: /data/db
      volumes:
      - name: mongo-data
        persistentVolumeClaim:
          claimName: mongodb-pvc